@if (recordWasSelected) {
<app-fact-box [style.display]="hasRecord ? null : 'none'" [label]="label" [title]="title" [subtitle]="subtitle" [config]="config?.factBox ?? {}" [sections]="displaySections" [context]="context" (action)="action.emit($event)"></app-fact-box>
}
@if (!hasRecord) { <div class="factbox-empty"><i class="ts-icon ts-icon-info" aria-hidden="true"></i><strong>Select a record</strong><span>Details from the selected record will appear here.</span></div> }

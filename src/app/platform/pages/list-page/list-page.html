@if (documentOnly || isInlineEntryPage) {
  @if (inlineDocumentWindowConfig; as entry) {
    <app-document-window
      [preferenceKey]="pageId" [embedded]="!documentOnly" [worksheet]="isWorksheetPage"
      [pageLabel]="entry.pageLabel" [title]="entry.title" [subtitle]="entry.subtitle"
      [headerCommandBar]="entry.headerCommandBar" [lineCommandBar]="entry.lineCommandBar"
      [headerToolbarButtons]="entry.headerToolbarButtons" [lineToolbarButtons]="entry.lineToolbarButtons"
      [headerSections]="entry.headerSections" [headerData]="entry.headerData"
      [lineColumns]="entry.lineColumns" [lineRows]="entry.lineRows"
      [lineCommandPolicy]="entry.lineCommandPolicy" [linePlacement]="entry.linePlacement" [lineTotals]="entry.lineTotals"
      [footerSections]="entry.footerSections" [factBoxSections]="entry.factBoxSections" [factBoxConfig]="entry.factBoxConfig" [factBoxDataSource]="entry.factBoxDataSource"
      [contentReady]="entry.contentReady !== false" [statusMessage]="entry.statusMessage" [interactionLocked]="entry.interactionLocked === true"
      (action)="handleInlineAction($event)" (closed)="requestClose()">
    </app-document-window>
    @if (isWorksheetPage && hasMore) {
      <button type="button" [disabled]="popupLoading || dirtyWorksheet" (click)="loadMoreWorksheet()">Load more records</button>
    }
  }
} @else {
<app-list-grid
  [config]="listConfig"
  [data]="rows"
  [showCommandBar]="false"
  [hasMore]="hasMore"
  [loading]="loading"
  [errorMessage]="error"
  [selectedRecord]="selectedRow"
  (loadMore)="loadNextPage()"
  (rowSelected)="openRecord($event)"
  (primaryAction)="openRecord($event)"
  (selectionChanged)="selectedRow = $event"
  (checkedKeysChanged)="handleCheckedKeysChanged($event)"
  (errorDismissed)="clearListError()"
  (command)="handleCommand($event)">
</app-list-grid>


}

@if (!documentOnly) {
<app-run-modal-host
  (action)="handlePopupAction($event)"
  (closed)="handlePopupClosed($event)">
</app-run-modal-host>
}

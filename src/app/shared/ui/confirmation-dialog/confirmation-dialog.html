@if (config; as dialog) {
  <section
    class="ts-confirmation-modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="dialog.title"
    tabindex="0"
    (keydown.escape)="cancel()"
    (keydown.enter)="confirm()">
    <h3 class="ts-confirmation-modal__title">{{ dialog.title }}</h3>
    <p class="ts-confirmation-modal__message">{{ dialog.message }}</p>

    <footer class="ts-confirmation-modal__actions">
      <button
        #confirmButton
        type="button"
        class="ts-confirmation-modal__button ts-confirmation-modal__button--primary"
        (click)="confirm()">
        {{ dialog.confirmLabel }}
      </button>

      @if (dialog.kind === 'confirm') {
        <button
          type="button"
          class="ts-confirmation-modal__button ts-confirmation-modal__button--secondary"
          (click)="cancel()">
          {{ dialog.cancelLabel || 'Cancel' }}
        </button>
      }
    </footer>
  </section>
}

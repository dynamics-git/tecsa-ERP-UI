<div class="header-form">
  @for (section of visibleSections; track section.id) {
    @for (field of section.fields; track field.key) {
      @if (!field.hidden) {
        <label [class.wide]="isWide(field)">
          {{ field.label }}

          @if (field.type === 'select' || field.type === 'dropdown' || field.type === 'lookup') {
            <select
              [value]="getFieldValue(field)"
              [disabled]="isFieldDisabled(field)"
              (focus)="notifyFieldInteracted(field); notifyDropdownOpened(field)"
              (change)="updateFieldValue(field, resolveSelectValue(field, $any($event.target).value))">
              @if (showEmptyOption(field)) {
                <option value=""></option>
              }
              @for (option of getFieldOptions(field); track $index) {
                <option [value]="option.value" [selected]="isOptionSelected(field, option.value)">{{ option.label }}</option>
              }
            </select>
          } @else if (field.type === 'textarea') {
            <textarea
              rows="3"
              [value]="getFieldValue(field)"
              [readOnly]="isFieldDisabled(field)"
              (focus)="notifyFieldInteracted(field)"
              (change)="updateFieldValue(field, coerceInputValue(field, $any($event.target).value))"></textarea>
          } @else {
            <input
              [value]="getFieldValue(field)"
              [readOnly]="isFieldDisabled(field)"
              (focus)="notifyFieldInteracted(field)"
              (change)="updateFieldValue(field, coerceInputValue(field, $any($event.target).value))" />
          }
        </label>
      }
    }
  }
</div>

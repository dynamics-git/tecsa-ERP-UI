<app-list-page [listConfig]="listConfig" [headerConfig]="headerConfig"
  [documentOnly]="!!runModal" [initialRecord]="runModal?.record"
  (closeRequested)="runModal?.close()" (businessCommand)="handleCommand($event)"/>
@if (selectedUser) {
  <app-permission-user-access [user]="selectedUser" (closed)="selectedUser=undefined"/>
}
@if (creating) {
  <div class="security-shade" (click)="creating=false">
    <section class="security-panel narrow" role="dialog" aria-modal="true" aria-label="Create ERP user" (click)="$event.stopPropagation()">
      <header class="security-top">
        <div><h2 class="security-title">New ERP User</h2><div class="security-sub">One user identity, assigned companies and roles separately.</div></div>
        <button type="button" class="ts-btn ts-btn-ghost" (click)="creating=false">Close</button>
      </header>
      <form class="security-body" (ngSubmit)="createUser()">
        <div class="security-grid">
          <label class="security-field">User ID<input class="ts-control" type="text" required maxlength="100" name="userName" [(ngModel)]="newUser.userName" autocomplete="off"></label>
          <label class="security-field">Full Name<input class="ts-control" type="text" required maxlength="150" name="name" [(ngModel)]="newUser.name"></label>
          <label class="security-field">Login Email<input class="ts-control" type="email" required maxlength="255" name="email" [(ngModel)]="newUser.email" autocomplete="off"></label>
          <label class="security-field">Initial Password<input class="ts-control" type="password" required minlength="12" name="password" [(ngModel)]="newUser.password" autocomplete="new-password"></label>
        </div>
        <p class="security-muted">After creating the user, assign Company access and a Role before they can sign in.</p>
        @if (error) { <p class="security-error" role="alert">{{error}}</p> }
        <div class="security-footer" style="padding-left:0;padding-right:0;margin-top:20px">
          <button type="button" class="ts-btn ts-btn-secondary" (click)="creating=false">Cancel</button>
          <button type="submit" class="ts-btn ts-btn-primary" [disabled]="saving">{{saving ? 'Creating…' : 'Create User'}}</button>
        </div>
      </form>
    </section>
  </div>
}

<main class="app-login">
  <section class="app-login-panel" aria-label="Sign in">
    <div class="app-login-brand">
      <span class="app-login-mark" aria-hidden="true">T</span>
      <div class="app-login-brand-copy">
        <h1>TecSA</h1>
        <p class="app-login-brand-label">Enterprise ERP</p>
        <p class="app-login-brand-helper">{{ choosingCompany ? 'Choose your company' : 'Sign in to continue' }}</p>
      </div>
    </div>
    @if (errorMessage) { <div class="app-login-alert" role="alert">{{ errorMessage }}</div> }
    @if (choosingCompany) {
      <div class="app-company-options" role="group" aria-label="Authorized companies">
        @for (company of availableCompanies; track company.systemId) {
          <button class="app-company-choice" type="button" [disabled]="loggingIn" (click)="chooseCompany(company.systemId)">
            <strong>{{ company.name }}</strong><small>{{ company.code }}</small>
          </button>
        }
      </div>
      <button class="app-login-switch" type="button" [disabled]="loggingIn" (click)="restart()">Use another account</button>
    } @else {
      <form class="app-login-form" [formGroup]="form" (ngSubmit)="login()" novalidate>
        <label class="ts-field" for="login-email">
          <span class="ts-label">Email</span>
          <input id="login-email" class="ts-control" type="email" formControlName="email" autocomplete="username" [readonly]="loggingIn" [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid" />
          @if (form.controls.email.touched && form.controls.email.invalid) { <span class="app-login-field-error">Enter a valid email address.</span> }
        </label>
        <label class="ts-field" for="login-password">
          <span class="ts-label">Password</span>
          <input id="login-password" class="ts-control" type="password" formControlName="password" autocomplete="current-password" [readonly]="loggingIn" [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid" />
          @if (form.controls.password.touched && form.controls.password.invalid) { <span class="app-login-field-error">Password is required.</span> }
        </label>
        <button type="submit" [disabled]="loggingIn">{{ loggingIn ? 'Signing in...' : 'Sign in' }}</button>
      </form>
    }
  </section>
</main>

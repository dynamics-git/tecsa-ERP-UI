<main class="app-login">
  <section class="app-login-panel" aria-label="Sign in">
    <div class="app-login-brand">
      <span class="app-login-mark">F</span>
      <div class="app-login-brand-copy">
        <h1>Filaz</h1>
        <p class="app-login-brand-label">Enterprise ERP</p>
        <p class="app-login-brand-helper">Sign in to continue</p>
      </div>
    </div>

    @if (errorMessage) {
      <div class="app-login-alert" role="alert">{{ errorMessage }}</div>
    }

    <form class="app-login-form" [formGroup]="form" (ngSubmit)="login()" novalidate>
      <label class="ts-field">
        <span class="ts-label">Email</span>
        <input class="ts-control" type="email" formControlName="email" autocomplete="username" [readonly]="loggingIn" />
      </label>

      <label class="ts-field">
        <span class="ts-label">Password</span>
        <input class="ts-control" type="password" formControlName="password" autocomplete="current-password" [readonly]="loggingIn" />
      </label>

      <button type="submit" [disabled]="loggingIn">
        {{ loggingIn ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
  </section>
</main>

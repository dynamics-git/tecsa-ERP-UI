name: Verify Angular UI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Import and style guardrails
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit and integration tests
        run: npm test -- --watch=false

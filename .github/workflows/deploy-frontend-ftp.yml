name: Deploy Frontend via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend-ftp
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Angular frontend files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure production ERP API URL
        env:
          ERP_API_BASE_URL: ${{ vars.ERP_API_BASE_URL }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const base = (process.env.ERP_API_BASE_URL || '').trim().replace(/\/$/, '');
          let url;
          try { url = new URL(base); } catch {
            throw new Error('Set repository variable ERP_API_BASE_URL to the full HTTPS ERP Laravel API URL.');
          }
          if (url.protocol !== 'https:' || url.username || url.password || url.search ||
              url.hash || !url.hostname || !url.pathname.endsWith('/api/v1')) {
            throw new Error('ERP_API_BASE_URL must be an HTTPS API base ending in /api/v1, with no credentials or query.');
          }
          const path = 'src/environments/environment.ts';
          const original = fs.readFileSync(path, 'utf8');
          const token = "'__ERP_API_BASE_URL__'";
          if (!original.includes(token)) throw new Error('ERP API URL placeholder missing.');
          fs.writeFileSync(path, original.replace(token, JSON.stringify(base)));
          NODE

      - name: Build Angular project
        run: npm run build

      - name: Validate required FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -euo pipefail
          missing=0
          for name in FTP_SERVER FTP_USER FTP_PASS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/tecsa-erp-ui/browser/
          server-dir: ./public/
          dangerous-clean-slate: false
          exclude: |
            **/*.map
            **/node_modules/**
            **/.git/**
            **/.github/**

name: Deploy Frontend via FTP

on:
  workflow_dispatch:

concurrency:
  group: deploy-frontend-ftp
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Angular frontend files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular project
        run: npm run build

      - name: Validate required FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -euo pipefail
          missing=0
          for name in FTP_SERVER FTP_USER FTP_PASS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/tecsa-erp-ui/browser/
          server-dir: ./public/
          dangerous-clean-slate: false
          exclude: |
            **/*.map
            **/node_modules/**
            **/.git/**
            **/.github/**
